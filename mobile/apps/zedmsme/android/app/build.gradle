apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * ZED MSME, the applicant app (registration, certifications, documents), rebuilt from the MSME code base of
 * ZED_MSME_Bronze. Its own applicationId com.qci.zed.msmeapp: it installs next to the Play Store ZED MSME app
 * (whose source and package name were never delivered) and does not update it.
 */
react {
    // npm workspaces: the app is mobile/apps/zedmsme, React Native is hoisted to mobile/node_modules.
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc").absolutePath + "/%OS-BIN%/hermesc"

    // -PzedBundleDebug=true embeds the JS bundle in the debug APK too, so a debug build starts without Metro
    // (cold start in airplane mode when testing the offline mode against a local MobileApi).
    if (project.findProperty("zedBundleDebug") == "true") {
        debuggableVariants = []
    }

    autolinkLibrariesWithApp()
}

// The JS bundle also depends on @zed/shared (outside the app folder the plugin watches).
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
    inputs.dir(file("../../../../packages/shared/src"))
}

/** R8 shrinking/obfuscation in release (APPS-SECURITY "No shrinking/obfuscation"). */
def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing: the existing upload keystore of the Play Store app, never stored in the repository.
 * Taken from Gradle properties (~/.gradle/gradle.properties or -P...) or, failing that, environment variables:
 *   ZED_UPLOAD_STORE_FILE      absolute path of the .jks/.keystore file
 *   ZED_UPLOAD_STORE_PASSWORD
 *   ZED_UPLOAD_KEY_ALIAS
 *   ZED_UPLOAD_KEY_PASSWORD
 * Without them the release build is signed with the local debug key (for testing only; Play refuses it).
 */
def signingValue(String name) {
    def fromProps = project.findProperty(name)
    return fromProps != null ? fromProps.toString() : System.getenv(name)
}
def releaseStoreFile = signingValue("ZED_UPLOAD_STORE_FILE")
def hasReleaseKey = releaseStoreFile != null && !releaseStoreFile.isEmpty() && file(releaseStoreFile).exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.qci.zed.msmeapp"
    defaultConfig {
        applicationId "com.qci.zed.msmeapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // A new app: starts at 2.0 (the store ZED MSME app is 1.x). Must only grow.
        // 2026-11-14: -PzedVersionCode=<n> -PzedVersionName=<x.y> for a store release (Build-ZedMsmeApp.ps1); 1 / 2.0 otherwise.
        versionCode((project.findProperty("zedVersionCode") ?: "1").toString().toInteger())
        versionName((project.findProperty("zedVersionName") ?: "2.0").toString())
    }
    signingConfigs {
        debug {
            // Android's default local debug key (~/.android/debug.keystore), created by the SDK.
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("ZED_UPLOAD_STORE_PASSWORD")
                keyAlias signingValue("ZED_UPLOAD_KEY_ALIAS")
                keyPassword signingValue("ZED_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Server environment (@zed/shared config/environments.ts): -PzedEnvironment=production|staging|local
            resValue "string", "zed_environment", (project.findProperty("zedEnvironment") ?: "staging").toString()
        }
        release {
            resValue "string", "zed_environment", (project.findProperty("zedEnvironment") ?: "production").toString()
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            // As the other ZED apps: Android_ZED_MSME_<MMM-dd-yyyy>-<versionName>-<versionCode>.apk
            def date = new Date().format('MMM-dd-yyyy')
            outputFileName = "Android_ZED_MSME_${date}-${variant.versionName}-${variant.versionCode}.apk"
        }
    }
}

if (!hasReleaseKey) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            logger.warn("ZED: ZED_UPLOAD_STORE_FILE not set or missing: the release build is signed with the DEBUG key (not for the Play Store).")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // CCAvenue's Android SDK (from the MSME code base's libs) and the libraries it calls, as the legacy build
    // declared them. AndroidX already: no Jetifier.
    implementation files('libs/indiasdk_grid_v1.2.aar')
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'org.jsoup:jsoup:1.12.2'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
