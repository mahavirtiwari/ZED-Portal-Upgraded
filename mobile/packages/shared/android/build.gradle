// Native part of @zed/shared (autolinked into every ZED app). Codegen builds the TurboModule spec from
// src/native/NativeZedDevice.ts (package.json "codegenConfig").
def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

apply plugin: "com.android.library"

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = providers.gradleProperty("android.builtInKotlin").orNull
if (agpMajor <= 8 || (builtInKotlin != null && !builtInKotlin.toBoolean())) {
    apply plugin: "org.jetbrains.kotlin.android"
}
apply plugin: "com.facebook.react"

android {
    namespace "org.qcin.zed.shared"
    compileSdk getExtOrDefault("compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion getExtOrDefault("minSdkVersion", 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.exifinterface:exifinterface:1.4.1"
    implementation "androidx.core:core-ktx:1.16.0"
}
